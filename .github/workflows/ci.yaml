name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.10 is the oldest Python GitHub's current runners provide.
        python-version: ["3.10", "3.12", "3.13"]
        otio-version: ["0.17.0", "latest"]
        exclude:
          # OpenTimelineIO 0.17.0 has no wheel for 3.13; it would compile from source.
          - python-version: "3.13"
            otio-version: "0.17.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.otio-version }}" == "latest" ]]; then
            pip install OpenTimelineIO
          else
            pip install "OpenTimelineIO==${{ matrix.otio-version }}"
          fi
          pip install -e '.[dev]'
      - name: Lint
        run: flake8 src tests
      - name: Test
        run: python -m pytest
